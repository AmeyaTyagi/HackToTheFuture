<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photon</title>
    <link rel="stylesheet" href="../shared/apple.css" />
    <style>
      body {
        background: var(--bg);
        overflow: hidden;
      }
      /* In a browser the panel is shown as a floating card. */
      html.in-browser body {
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #a1c4fd, #c2e9fb 45%, #fbc2eb);
      }
      html.in-browser .panel {
        width: 340px;
        border-radius: 18px;
        background: var(--bg);
        backdrop-filter: blur(40px) saturate(180%);
        box-shadow: var(--shadow);
      }
      .panel {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        -webkit-app-region: drag;
      }
      header .switch {
        -webkit-app-region: no-drag;
      }
      .ring {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 50%;
        background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff3b30);
        mask: radial-gradient(circle, transparent 42%, #000 44%);
      }
      header h1 {
        font-size: 17px;
        font-weight: 600;
      }
      header p {
        font-size: 12px;
        color: var(--text-2);
      }
      header div {
        flex: 1;
      }
      .types {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .types button {
        text-align: left;
        border: 0;
        padding: 9px 12px;
        border-radius: 10px;
        font: inherit;
        color: var(--text);
        background: var(--card);
        box-shadow: 0 0 0 0.5px var(--line);
        cursor: pointer;
      }
      .types button strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .types button span {
        font-size: 11px;
        color: var(--text-2);
      }
      .types button[aria-pressed='true'] {
        color: #fff;
        background: var(--accent);
        box-shadow: none;
      }
      .types button[aria-pressed='true'] span {
        color: rgba(255, 255, 255, 0.82);
      }
      .types button:focus-visible,
      .tools button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent);
        outline-offset: 2px;
      }
      .strength {
        padding: 10px 14px 6px;
      }
      .strength div {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
      }
      .strength output {
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .tools button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        border: 0;
        padding: 10px 14px;
        font: inherit;
        color: var(--text);
        background: transparent;
        border-bottom: 0.5px solid var(--line);
        cursor: pointer;
      }
      .tools button:last-child {
        border-bottom: 0;
      }
      .tools button:hover {
        background: var(--fill);
      }
      .tools kbd {
        font: inherit;
        font-size: 11px;
        color: var(--text-2);
      }
      .tools button[aria-pressed='true'] kbd {
        color: var(--green);
        font-weight: 600;
      }
      #status {
        min-height: 16px;
        margin: 0 4px;
        font-size: 11px;
        color: var(--text-2);
      }
      #status.error {
        color: var(--red);
      }
      #status button {
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--accent);
        background: none;
        cursor: pointer;
      }
      footer {
        display: flex;
        justify-content: space-between;
        margin: 0 4px;
        font-size: 11px;
        color: var(--text-2);
      }
      footer button {
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--accent);
        background: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <header>
        <div class="ring"></div>
        <div>
          <h1>Photon</h1>
          <p id="subtitle">Color correction is off</p>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox" aria-label="Color correction" />
          <span></span>
        </label>
      </header>

      <section>
        <p class="label">Vision type</p>
        <div class="types" id="types">
          <button data-type="protan"><strong>Protan</strong><span>Red-weak</span></button>
          <button data-type="deutan"><strong>Deutan</strong><span>Green-weak</span></button>
          <button data-type="tritan"><strong>Tritan</strong><span>Blue-yellow</span></button>
          <button data-type="achroma"><strong>Monochrome</strong><span>No color vision</span></button>
        </div>
      </section>

      <section>
        <p class="label">Strength</p>
        <div class="card strength">
          <div><span>How strong the color blindness is</span><output id="severity-value">80%</output></div>
          <input id="severity" type="range" min="0" max="100" step="1" aria-label="Strength" />
        </div>
      </section>

      <section>
        <p class="label">Boost</p>
        <div class="card strength">
          <div><span>How far Photon pushes colors apart</span><output id="boost-value">2×</output></div>
          <input id="boost" type="range" min="1" max="3" step="0.1" aria-label="Boost" />
        </div>
      </section>

      <section>
        <p class="label">Tools</p>
        <div class="card tools">
          <button data-action="test">Take the vision test <kbd>1 minute</kbd></button>
          <button data-action="simulator" id="simulator">Judge view <kbd data-key="S"></kbd></button>
          <button data-action="names" id="names">Color names <kbd data-key="C"></kbd></button>
          <button data-action="conflicts" id="conflicts">Find conflicts <kbd data-key="F"></kbd></button>
        </div>
      </section>

      <p id="status" role="status"></p>

      <footer>
        <span id="hint"></span>
        <span><button id="hide">Hide</button> · <button id="quit">Quit Photon</button></span>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
