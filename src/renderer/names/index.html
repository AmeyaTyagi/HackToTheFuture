<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photon Color Names</title>
    <link rel="stylesheet" href="../shared/apple.css" />
    <style>
      body {
        background: transparent;
        overflow: hidden;
      }
      #label {
        position: fixed;
        left: 4px;
        top: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        padding: 0 16px 0 8px;
        border-radius: 24px;
        color: #fff;
        background: rgba(28, 28, 30, 0.92);
        box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.25);
        white-space: nowrap;
      }
      #label[hidden] {
        display: none;
      }
      #swatch {
        width: 32px;
        height: 32px;
        flex: none;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.85);
      }
      #name {
        font-size: 15px;
        font-weight: 600;
        text-transform: capitalize;
      }
      #hex {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.66);
        font-variant-numeric: tabular-nums;
      }
      /* Browser preview: the label follows the pointer over a sample image. */
      html.in-browser body {
        background: #000;
        cursor: crosshair;
      }
      #sample {
        display: none;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }
      html.in-browser #sample {
        display: block;
      }
      html.in-browser #label {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="sample"></canvas>
    <div id="label">
      <div id="swatch"></div>
      <div>
        <div id="name">Move the pointer</div>
        <div id="hex">&nbsp;</div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
